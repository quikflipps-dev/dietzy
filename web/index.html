<meta name="mobile-web-app-capable" content="yes">

<style>
/* Dietzy palette: deep green, fresh green, yolk, salmon. */
:root{
  --bg:#f1f5ea; --card:#ffffff; --ink:#1a2a1f; --muted:#62705f; --line:#e0e8d6; --soft:#eef3e3;
  --accent:#2f6b3c; --accent-ink:#ffffff; --accent-soft:#e2efd0;
  --hero:#1f4a2b; --hero-ink:#f4f8ec; --flesh:#cfe39a; --yolk:#f3b52f; --pit:#8a5a3b;
  --warn:#c4532f; --warn-soft:#fbe9e1; --good:#2f8a45;
  --p:#e4705a; --c:#f3b52f; --f:#8fb43a; --maint:#2a7d93; --maint-soft:#e1f1f5;
  --r-lg:26px; --r:20px; --r-sm:14px;
  --shadow:0 1px 0 rgba(31,74,43,.04),0 8px 24px -12px rgba(31,74,43,.18);
  --display:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1611; --card:#172119; --ink:#e9f0e3; --muted:#9aa896; --line:#253128; --soft:#1d2a20;
  --accent:#7cc48a; --accent-ink:#0e1a11; --accent-soft:#1f3a26; --hero:#203d27; --hero-ink:#eef6e6;
  --flesh:#a9c96b; --yolk:#f5c04d; --warn:#f08a64; --warn-soft:#3a2219; --good:#6fd08a;
  --p:#f08a74; --c:#f5c04d; --f:#a9c96b; --maint:#5cc2dc; --maint-soft:#123039; --shadow:none;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--yolk);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:14px 16px 150px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 2px 12px}
.brand{font-family:var(--display);font-weight:800;font-size:23px;letter-spacing:-.03em;display:flex;align-items:center;gap:7px}
.brand .logo{width:28px;height:28px}
.brand>span>span{color:var(--accent)}
.sync{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.cloud i{background:var(--good)} .sync.err i{background:var(--warn)}
h1{font-family:var(--display);font-size:26px;line-height:1.1;letter-spacing:-.025em;margin:2px 0 0;font-weight:800}
h2{font-family:var(--display);font-size:17px;margin:0 0 10px;font-weight:700;letter-spacing:-.01em}
h3{font-size:13.5px;margin:16px 0 8px;font-weight:700;color:var(--muted)}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:12.5px} .tiny{font-size:11.5px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:700;background:var(--soft);color:var(--ink);white-space:nowrap}
.chip.loss{background:var(--accent-soft);color:var(--accent)}
.chip.maint,.chip.care{background:var(--maint-soft);color:var(--maint)}
.chip.goal{background:#fff1c7;color:#7a5600}
.chip.streak{background:#fff1c7;color:#7a4a00}
@media (prefers-color-scheme:dark){.chip.goal,.chip.streak{background:#3a2e10;color:var(--yolk)}}
.big{font-family:var(--display);font-size:46px;font-weight:800;letter-spacing:-.04em;line-height:1}
.big small{font-family:"Plus Jakarta Sans",sans-serif;font-size:16px;font-weight:600;color:var(--muted);margin-left:4px;letter-spacing:0}
.stat{flex:1;background:var(--soft);border-radius:var(--r-sm);padding:10px}
.stat b{display:block;font-family:var(--display);font-size:18px;letter-spacing:-.01em} .stat span{font-size:11px;color:var(--muted)}
.fastbig{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:30px;margin:6px 0 8px;line-height:1}.fastbig small{font-size:14px;font-weight:600;color:var(--muted);font-family:"Plus Jakarta Sans",sans-serif}
.daypick{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.daypick button{flex:1 0 12%;padding:8px 0;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-size:13px}.daypick button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.track{height:9px;background:var(--soft);border-radius:99px;overflow:hidden}
.track>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s}
.btn{border:0;border-radius:var(--r-sm);padding:11px 14px;font-weight:700;cursor:pointer;background:var(--soft);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:var(--warn-soft);color:var(--warn)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:11px}
.btn:disabled{opacity:.5;cursor:default}
.btn.block{width:100%}
.btn:active{transform:scale(.97)}

/* Home hero: the one bold moment */
.greet{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:4px 2px 12px}
.hero{position:relative;overflow:hidden;background:var(--hero);color:var(--hero-ink);border-radius:var(--r-lg);padding:20px 18px 18px;margin-bottom:12px}
.hero .art{position:absolute;right:-14px;top:-14px;width:92px;opacity:.5;transform:rotate(-8deg);pointer-events:none}
.hero .lbl{font-size:13px;opacity:.8;font-weight:600}
.hero .big{color:var(--hero-ink);font-size:58px;margin-top:4px}
.hero .big small{color:var(--hero-ink);opacity:.7}
.hero .tiles{display:flex;gap:8px;margin-top:16px;position:relative}
.hero .tiles div{flex:1;background:rgba(255,255,255,.1);border-radius:var(--r-sm);padding:9px 10px}
.hero .tiles b{display:block;font-family:var(--display);font-size:18px}
.hero .tiles span{font-size:11px;opacity:.75}
.hero .journey{margin-top:16px}
.hero .journey .track{background:rgba(255,255,255,.14);height:10px}
.hero .journey .track>i{background:linear-gradient(90deg,var(--flesh),var(--yolk))}
.hero .journey .ends{display:flex;justify-content:space-between;font-size:11.5px;opacity:.8;margin-top:6px}
.hero .phase{font-size:12.5px;margin-top:10px;opacity:.9}
.hero .btn{background:var(--yolk);color:#2b1d00}
.hero .btn.ghost{background:rgba(255,255,255,.12);color:var(--hero-ink);border:0}

.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.actions .btn{flex-direction:column;padding:13px 4px 11px;font-size:12px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.actions .btn .e{font-size:24px;line-height:1}
.actions .btn.primary{background:var(--yolk);color:#2b1d00;border-color:transparent}

.ringwrap{display:flex;align-items:center;gap:16px}
.plate{width:142px;height:142px;flex:none}
.plate .rim{fill:var(--soft)} .plate .dish{fill:var(--card)}
.ring-bg{fill:none;stroke:var(--line);stroke-width:11}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring-fg.over{stroke:var(--warn)}
.ringc{position:relative}
.ringc .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ringc .lbl b{font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1}
.ringc .lbl span{font-size:11.5px;color:var(--muted);margin-top:3px}
.bars{flex:1;display:flex;flex-direction:column;gap:11px}
.bar .t{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;gap:6px}
.bar .t b{font-weight:700}
.bar .track>i.p{background:var(--p)} .bar .track>i.c{background:var(--c)} .bar .track>i.f{background:var(--f)}
.bar .track>i.over{background:var(--warn)}
.sugg{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line);align-items:flex-start}
.sugg:first-of-type{border-top:0}
.sugg .dot{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;flex:none;font-size:20px}
.sugg.warn .dot{background:var(--warn-soft)}
.meal{margin-bottom:12px}
.meal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.meal-h h2{display:flex;align-items:center;gap:8px;margin:0}
.meal-h .me{font-size:22px}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.item:first-child{border-top:0}
.avatar{width:40px;height:40px;border-radius:13px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.item .nm{flex:1;min-width:0}
.item .nm b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .nm span{font-size:11.5px;color:var(--muted)}
.item .cal{font-family:var(--display);font-weight:700;font-size:15px}
.tag{font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--warn-soft);color:var(--warn);margin-left:5px;vertical-align:1px}
.tag.ai{background:var(--accent-soft);color:var(--accent)}
.datenav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.datenav b{font-family:var(--display);font-size:18px}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center}
.seg{display:flex;background:var(--soft);border-radius:var(--r-sm);padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;padding:8px 4px;border-radius:11px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
input.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 11px;font-size:15px;color:var(--ink);font-weight:500}
textarea.in{min-height:84px;resize:vertical}
@supports (-webkit-touch-callout:none){input,select,textarea,input.in,select.in,textarea.in{font-size:16px}} /* iPhone: stop Safari zooming in on every tap */
input.in:focus,select.in:focus,textarea.in:focus{outline:2px solid var(--accent);outline-offset:-1px}
.mbar{display:grid;grid-template-columns:22px 84px 1fr 96px;align-items:center;gap:8px;font-size:12.5px;padding:4px 0}
.mbar .e{font-size:16px;text-align:center}
.mbar .v{text-align:right;color:var(--muted);font-size:11px;white-space:nowrap}
.chartbox{position:relative;height:220px}
.empty{text-align:center;color:var(--muted);padding:18px 8px;font-size:14px}
.empty .e{display:block;font-size:34px;margin-bottom:6px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:end}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);text-decoration:none;padding:6px 0;border-radius:12px}
nav.tabs .cam{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--accent);cursor:pointer;-webkit-tap-highlight-color:transparent}
nav.tabs .cam .camb{width:66px;height:66px;margin-top:-30px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#4c9a5b,var(--accent) 60%,#1f4a2b);border:4px solid var(--card);box-shadow:0 10px 22px -8px rgba(31,74,43,.6),0 0 0 2px var(--yolk);transition:transform .15s}
nav.tabs .cam:active .camb{transform:scale(.93)}
nav.tabs .cam .camb svg{width:40px;height:40px}
nav.tabs a.on{color:var(--accent);background:var(--accent-soft)}
nav.tabs svg{width:22px;height:22px}
.sheet-bg{position:fixed;inset:0;background:rgba(12,24,15,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@media(min-width:620px){.sheet-bg{align-items:center}.sheet{border-radius:26px;max-height:86vh}}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheet-h h2{margin:0;font-size:20px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--hero);color:var(--hero-ink);padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.22);display:flex;gap:12px;align-items:center;max-width:90vw}
.toast button{background:none;border:0;color:var(--yolk);font-weight:800;cursor:pointer}
.res{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.res:first-child{border-top:0}
.res .nm{flex:1;min-width:0;cursor:pointer}
.res .nm b{font-size:14px;font-weight:600}
.res .nm span{display:block;font-size:11.5px;color:var(--muted)}
.res .avatar{width:36px;height:36px;font-size:19px;border-radius:11px}
.photo-drop{border:2px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;cursor:pointer;display:block;color:var(--muted);background:var(--card)}
.photo-drop img{max-width:100%;max-height:260px;border-radius:14px;display:block;margin:0 auto}
.photo-drop .e{font-size:40px;display:block;margin-bottom:4px}
.airow{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;margin-bottom:8px;background:var(--card)}
.airow .g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.airow .g input{padding:7px 6px;font-size:13px}
.airow .g label{font-size:10px}
.mood{display:flex;gap:6px}
.mood button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 0;font-size:22px;cursor:pointer}
.mood button.on{border-color:var(--accent);background:var(--accent-soft)}
.jentry{padding:12px 0;border-top:1px solid var(--line)}
.hgt{grid-column:1/-1;font-size:12px;font-weight:600;color:var(--muted)}.hgt-units button{white-space:nowrap}.hgt-units{display:inline-flex;background:var(--soft);border-radius:99px;padding:2px}.hgt-units button{border:0;background:none;font:inherit;font-size:11.5px;font-weight:700;color:var(--muted);padding:3px 8px;border-radius:99px;cursor:pointer}.hgt-units button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.hgt-row{display:flex;align-items:center;gap:6px;margin-top:4px;max-width:340px}.hgt-row .in{flex:1;min-width:0}.hgt-u{font-size:13px;color:var(--muted);font-weight:600}
.fbars{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;margin-top:6px}.fbar{text-align:center;font-size:10px}.fbar small{display:block;line-height:1.3}.fcol{position:relative;height:120px;background:var(--soft);border-radius:6px;overflow:hidden;display:flex;align-items:flex-end}.fcol i{display:block;width:100%;border-radius:6px 6px 0 0}.fgoal{position:absolute;left:0;right:0;border-top:2px dashed var(--ink);opacity:.45}
.gopt{display:flex;gap:10px;align-items:flex-start;width:100%;border:1.5px solid var(--line);background:var(--card);color:inherit;font:inherit;border-radius:16px;padding:12px;margin-top:8px;cursor:pointer}.gopt.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--card))}.gopt .pe{font-size:24px;line-height:1}
.mbarsplit{display:flex;height:26px;border-radius:99px;overflow:hidden;font-size:11px;font-weight:800;color:#fff}.mbarsplit i{display:flex;align-items:center;justify-content:center;font-style:normal;white-space:nowrap;overflow:hidden}
.dg{margin-top:10px;display:grid;gap:8px}.dg>div{background:var(--soft);border-radius:12px;padding:9px 11px;font-size:13.5px}.dg b{display:block;margin-bottom:2px}
.fitrow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.fitrow>div{text-align:center;background:var(--soft);border-radius:12px;padding:8px 2px;font-size:18px}.fitrow>div.on{outline:2px solid var(--accent)}.fitrow small{display:block;font-size:10px;line-height:1.2;margin:3px 0;color:var(--muted)}
.fit{font-size:12px;letter-spacing:1px;color:var(--accent);white-space:nowrap}.fit.f1{color:var(--muted)}
.rpt{background:#fff;color:#1b1f1a;border:1px solid var(--line);border-radius:14px;padding:16px;font-size:12.5px;line-height:1.4}.rpt header{display:flex;justify-content:space-between;gap:10px;border-bottom:2px solid #2f6b3c;padding-bottom:8px;margin-bottom:6px}.rpt h3{margin:0;font-size:18px;color:#2f6b3c}.rpt h4{margin:12px 0 4px;font-size:12px;text-transform:none;color:#2f6b3c;border-bottom:1px solid #dfe5d6;padding-bottom:3px}.rpt table{width:100%;border-collapse:collapse}.rpt th,.rpt td{text-align:left;vertical-align:top;padding:3px 6px 3px 0}.rpt th{width:38%;font-weight:600;color:#55604f}.rpt .rlab th{width:auto;font-size:11px}.rpt .rsm{font-size:11px;color:#6b7466}.rpt ul{margin:4px 0;padding-left:18px}.rpt footer{margin-top:12px;font-size:10.5px;color:#6b7466;border-top:1px solid #dfe5d6;padding-top:6px}
#printRoot{display:none}
@media print{body.printing>*:not(#printRoot){display:none!important}body.printing #printRoot{display:block}body.printing{background:#fff}#printRoot .rpt{border:0;padding:0;font-size:11.5px}#printRoot section{break-inside:avoid}}
[hidden]{display:none!important}

/* ================= Protein quality (PDCAAS) =================

const PDCAAS_MAP = [

  [/egg/, 1, "egg"],
  [/soy protein|protein isolate.*soy|soy isolate/, 1, "soy protein isolate"],
  [/mycoprotein|quorn/, .99, "mycoprotein"],
  [/pork|ham\b|tenderloin/, .98, "pork"],
  [/salmon|cod|tilapia|trout|halibut|sardine|mackerel|fish|shrimp|prawn|crab|lobster|scallop/, .98, "fish & seafood"],
  [/tuna/, .93, "tuna"],
  [/chicken|turkey|duck/, .92, "poultry"],
  [/beef|steak|sirloin|ribeye|brisket|burger|bison|lamb|venison|bacon|sausage|jerky|meat/, .92, "red meat"],
  [/tofu|tempeh|edamame|soybean|soy milk|\bsoy\b/, .91, "soy foods"],
  [/pea protein/, .89, "pea protein"],
  [/chickpea|hummus/, .78, "chickpeas"],
  [/black bean|kidney bean|pinto|bean/, .75, "beans"],
  [/potato|sweet potato|yam/, .74, "potatoes"],
  [/lentil|split pea|legume/, .7, "lentils & legumes"],
  [/broccoli|spinach|kale|greens|salad|cauliflower|asparagus|zucchini|pepper|tomato|carrot|vegetable|mushroom/, .73, "vegetables"],
  [/hemp/, .66, "hemp seeds"],
  [/apple|banana|orange|berry|berries|grape|melon|mango|pineapple|peach|pear|fruit/, .64, "fruit"],

  [/oat|quinoa|barley|corn|cereal|granola/, .59, "cereals"],
  [/peanut|almond|cashew|walnut|pecan|pistachio|nut|seed/, .52, "nuts & seeds (peanut value)"],
  [/rice/, .5, "rice"],
  [/bread|toast|pasta|spaghetti|noodle|wheat|bagel|tortilla|cracker|bun|pizza/, .42, "wheat"],

function pdcaasOf(food) {

}

function searchFoods(q) {
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  const pool = S.profile.myFoods.map(f => Object.assign({ mine: true }, f)).concat(recentFoods(), FOODS);
  const seen = new Set(), out = [];
  for (const f of pool) { const n = f.name.toLowerCase(); if (!words.every(w => n.includes(w))) continue; const k = n + "|" + f.serving; if (seen.has(k)) continue; seen.add(k); out.push(f); }
  const score = f => { const n = f.name.toLowerCase(); return (n.startsWith(words[0]) ? 0 : 2) + (f.mine || f.recent ? -1 : 0) + n.length / 100; };
  return out.sort((a, b) => score(a) - score(b));
}

}

// Exponentially smoothed weight (10% of each new weigh-in, as in The Hacker's Diet). Daily water swings mostly cancel out.

    for (let i = 0; i < 1500 && d <= end; i++) { if (by[d] != null) t += .1 * (by[d] - t); out[d] = t; d = addDays(d, 1); }

/* ================= Smarter calorie goal: learn the real burn from food log + trend ================= */

function csvRows(text) {
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === ",") { row.push(cur); cur = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += ch;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r[0] || "").trim());
}
// Samsung CSVs start with a line like "com.samsung.health.weight,6315003,3", then the header row.
function shTable(text) {

  const skip = rows[0].length <= 3 && /^com\.samsung/.test(rows[0][0] || "") ? 1 : 0;

}

function addFood(f, qty = 1, silent) {

  dayW(d).foods.push(item); save([monthKey(d)]); render();

function recentFoods() {

function parseDateLoose(s) {

  m = s.match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/);
  if (m) {
    let a = +m[1], b = +m[2], y = +m[3]; if (y < 100) y += 2000;
    const [mo, da] = a > 12 ? [b, a] : [a, b]; // assume month-first unless impossible

  }

  if (m && MON.includes(m[1].slice(0, 3).toLowerCase())) return `${m[3]}-${pad(MON.indexOf(m[1].slice(0, 3).toLowerCase()) + 1)}-${pad(+m[2])}`;
  m = s.match(/\b(\d{1,2})\s+([A-Za-z]{3,9})\.?,?\s+(\d{4})/);
  if (m && MON.includes(m[2].slice(0, 3).toLowerCase())) return `${m[3]}-${pad(MON.indexOf(m[2].slice(0, 3).toLowerCase()) + 1)}-${pad(+m[1])}`;

  const t = Date.parse(s); return isNaN(t) ? null : ymd(new Date(t));
}

function setPath(path, val) {
  const parts = path.split("."); let o = S;
  for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]] = o[parts[i]] || {};
  const last = parts[parts.length - 1];
  if (val === null || val === "" || (typeof val === "number" && !isFinite(val))) delete o[last]; else o[last] = val;
}
document.addEventListener("change", e => {

  const type = el.dataset.type; let v = el.value;
  if (type === "num") v = el.value === "" ? null : num(el.value);
  else if (type === "w") v = el.value === "" ? null : r1(wIn(el.value));
  else if (type === "h") v = r1(hIn(el.value));
  else if (type === "bool") v = el.checked;
  if (k.startsWith("profile.ovr.") || k.startsWith("profile.micro.")) { if (!v) v = null; }
  if (k === "profile.startWeight" && v && S.phase.milestone == null) S.phase.milestone = v;
  if (k === "profile.blindWeight") { blindPeek = false; if (v) S.profile.hideWeight = true; }

});

      <button class="btn" type="submit" id="au-go">Sign in</button>
      ${DZ_CFG.emailEnabled ? `<div class="authlinks"><button type="button" class="linkbtn" id="au-forgot">Forgot password?</button><button type="button" class="linkbtn" id="au-magic">Email me a sign-in link</button></div>` : `<div class="tiny" style="text-align:center;color:rgba(255,255,255,.75)">Forgot your password? Email <a href="mailto:${esc(DZ_CFG.supportEmail || "")}">${esc(DZ_CFG.supportEmail || "support")}</a>.</div>`}
    </form>`;
  const gnote = DZ_CFG.googleSignIn && mode === "up" ? `<div class="tiny" style="text-align:center;margin:-4px 0 10px;color:rgba(255,255,255,.75)">With Google, you'll confirm the terms on the next screen.</div>` : "";
  dzAuthShell(tabs + msg + gbtn + gnote + form);
  const gb = $("#au-google"); if (gb) gb.onclick = async () => { err(""); gb.disabled = true; gb.querySelector("span").textContent = "Opening Google…"; try { await DZ.google(); } catch (e) { err(e.message); gb.disabled = false; gb.querySelector("span").textContent = "Continue with Google"; } };
  $$(".authseg button").forEach(b => b.onclick = () => dzShowAuth(b.dataset.m));
  const err = t => { $("#au-err").textContent = t || ""; };
  $$("#authf input").forEach(i => i.addEventListener("input", () => err("")));
  const busy = (on, label) => { const g = $("#au-go"); g.disabled = on; if (label) g.textContent = label; };
  const emailOk = () => { const e = $("#au-email").value.trim(); if (!/^\S+@\S+\.\S+$/.test(e)) { err("Enter your email address."); return null; } return e; };
  $("#authf").onsubmit = async ev => {
    ev.preventDefault(); err("");
    const email = emailOk(); if (!email) return;
    const pass = $("#au-pass").value;
    if (mode === "up") {
      if (pass.length < 8) return err("Use a password with at least 8 characters.");
      if (!$("#au-18").checked) return err("You need to be 18 or older to use Dietzy.");
      if (!$("#au-terms").checked) return err("Please agree to the Terms of Use and Privacy Policy.");
      if (!$("#au-health").checked) return err("Dietzy needs your consent to store your health information to work.");
      const label = $("#au-go").textContent; busy(true, "Creating your account…");
      try {
        const consents = { version: DZ_CFG.termsVersion || "1", at: new Date().toISOString(), terms: true, privacy: true, health_data: true, age_18: true };
        const r = await DZ.signUp(email, pass, consents);
        if (r && r.session) return dzSignedIn();
        dzShowAuth("in", `<b>Check your email.</b> We sent a confirmation link to ${esc(email)}. Tap it, then sign in here.`);
      } catch (e) { err(e.message); busy(false, label); }
    } else {
      if (!pass) return err("Enter your password.");
      busy(true, "Signing in…");
      try { await DZ.signIn(email, pass); dzSignedIn(); }
      catch (e) { err(e.message); busy(false, "Sign in"); }
    }
  };
  const fg = $("#au-forgot"); if (fg) fg.onclick = async () => { err(""); const email = emailOk(); if (!email) return; try { await DZ.resetPassword(email); dzShowAuth("in", `<b>Check your email.</b> If there's an account for ${esc(email)}, we sent a link to set a new password.`); } catch (e) { err(e.message); } };
  const mg = $("#au-magic"); if (mg) mg.onclick = async () => { err(""); const email = emailOk(); if (!email) return; try { await DZ.magicLink(email); dzShowAuth("in", `<b>Check your email.</b> We sent a sign-in link to ${esc(email)}.`); } catch (e) { err(e.message); } };
  setTimeout(() => { const e = $("#au-email"); if (e) e.focus(); }, 50);
}
function dzSetupNeeded() {
  document.body.classList.add("dz-auth");
  $("#view").innerHTML = `<div class="card"><h2>Almost ready</h2><div class="small">This copy of Dietzy isn't connected to its server yet. Add the Supabase project URL and public key to <b>config.js</b> (see the README).</div></div>`;
}
let dzStarted = false;
async function dzSignedIn() {
  const u = DZ.user; if (!u) return dzShowAuth();
  if (dzStarted && dzSignedIn._uid === u.id) return; // already running for this account (sign-in events can repeat)
  if (dzConsentGate.open === u.id) return; // consent screen already showing for this account
  dzSignedIn._uid = u.id;
  // This device's saved data belongs to one account at a time.
  const last = lsGet("dz-user");
  if (last && last !== u.id) { dzWipeDevice(); S = mergeState(null); resetCalc(); }
  lsSet("dz-user", u.id);
  document.body.classList.remove("dz-auth");
  if (location.hash && /access_token|type=|error_description/.test(location.hash)) history.replaceState(null, "", location.pathname);
  // Nobody uses Dietzy without agreeing to the current Terms, Privacy Policy and health-data consent
  // (Google sign-ups skip the sign-up checkboxes, and the terms can change).
  const c = (u.user_metadata || {}).consents;
  if (DZ_CFG.termsVersion && (!c || c.version !== DZ_CFG.termsVersion)) { dzStarted = false; return dzConsentGate(!!c); }
  if (!dzStarted) { dzStarted = true; route(); } else render();
  initCloud();
  DZ.recordConsents().catch(() => {});
}
function dzConsentGate(updated) {
  const u = DZ.user;
  dzConsentGate.open = u && u.id;
  dzAuthShell(`<div class="authform">
    <div class="small" style="text-align:center;margin:6px 0 4px">${updated ? "We've updated Dietzy's Terms of Use and Privacy Policy. Please review and accept to keep using Dietzy." : `Welcome${u && u.email ? ", <b>" + esc(u.email) + "</b>" : ""}! One last step before you start.`}</div>
    <label class="dzchk"><input type="checkbox" id="au-18"><span>I'm 18 or older.</span></label>
    <label class="dzchk"><input type="checkbox" id="au-terms"><span>I agree to the <a href="${LEGAL.terms}" target="_blank" rel="noopener">Terms of Use</a> and <a href="${LEGAL.privacy}" target="_blank" rel="noopener">Privacy Policy</a>, and I understand Dietzy is for education only and I'll check with my doctor before making health changes.</span></label>
    <label class="dzchk"><input type="checkbox" id="au-health"><span>I consent to Dietzy collecting and using my health information (like weight, food, conditions, medications and test results) to run the app for me, as described in the Privacy Policy. Dietzy does not sell it.</span></label>
    <div id="au-err" class="autherr"></div>
    <button class="btn" type="button" id="au-go">${updated ? "Accept and continue" : "I'm committed — let's go"}</button>
    <div style="text-align:center"><button type="button" class="linkbtn" id="au-out">Not you? Sign out</button></div>
  </div>`);
  const err = t => { $("#au-err").textContent = t || ""; };
  $$(".authform input").forEach(i => i.addEventListener("change", () => err("")));
  $("#au-out").onclick = () => dzSignOut();
  $("#au-go").onclick = async () => {
    if (!$("#au-18").checked) return err("You need to be 18 or older to use Dietzy.");
    if (!$("#au-terms").checked) return err("Please agree to the Terms of Use and Privacy Policy.");
    if (!$("#au-health").checked) return err("Dietzy needs your consent to store your health information to work.");
    const g = $("#au-go"); g.disabled = true; g.textContent = "Saving…";
    try { await DZ.acceptCurrentTerms(DZ_CFG.termsVersion); dzConsentGate.open = null; dzSignedIn._uid = null; dzSignedIn(); }
    catch (e) { err("Couldn't save that — check your connection and try again."); g.disabled = false; g.textContent = "Try again"; }
  };
}
async function dzBoot() {
  if (!window.DZ || !DZ.ready) return dzSetupNeeded();
  DZ.onAuth((event) => {
    if (event === "PASSWORD_RECOVERY") setTimeout(() => dzChangePassword(true), 300);
    if (event === "SIGNED_IN" && !dzStarted) dzSignedIn();
    if (event === "SIGNED_OUT") { dzStarted = false; dzSignedIn._uid = null; dzConsentGate.open = null; }
  });
  let s = null;
  try { s = await DZ.init(); } catch {}
  if (s) dzSignedIn(); else dzShowAuth();
}
function accountCard() {
  const u = window.DZ && DZ.user; if (!u) return "";
  return `<div class="card nofold"><h2>Your account</h2>
    <div class="small">Signed in as <b>${esc(u.email || "")}</b></div>
    <div class="row" style="margin-top:10px;flex-wrap:wrap;gap:8px"><button class="btn sm" data-act="dz-signout">Sign out</button><button class="btn sm ghost" data-act="dz-pass">Change password</button><button class="btn sm ghost danger" data-act="dz-delete">Delete my account</button></div>
    <div class="tiny muted" style="margin-top:8px"><a href="${LEGAL.terms}" target="_blank" rel="noopener">Terms of Use</a> · <a href="${LEGAL.privacy}" target="_blank" rel="noopener">Privacy Policy</a> · Dietzy is for education only — check with your doctor before making health changes.</div></div>`;
}
async function dzSignOut() {
  clearTimeout(flushTimer); try { await flush(); } catch {}
  await DZ.signOut(); dzWipeDevice(); location.replace(location.pathname);
}
function dzChangePassword(recovery) {
  openSheet(recovery ? "Set a new password" : "Change password", `<label class="f">New password<input class="in" id="np-1" type="password" autocomplete="new-password" placeholder="At least 8 characters"></label>
    <div id="np-err" class="small" style="color:var(--warn);margin-top:6px"></div>
    <button class="btn primary block" style="margin-top:12px" id="np-go">Save password</button>`, () => {
      $("#np-go").onclick = async () => { const p = $("#np-1").value; if (p.length < 8) return ($("#np-err").textContent = "Use at least 8 characters."); try { await DZ.updatePassword(p); closeSheet(); toast("Password saved"); } catch (e) { $("#np-err").textContent = e.message; } };
    });
}
function dzDeleteAccount() {
  openSheet("Delete your account?", `<div class="small">This permanently erases your account and everything in it — food logs, weigh-ins, health info, photos and chat. It can't be undone.</div>
    <div class="small" style="margin-top:8px">Want a copy first? Use <b>Backup</b> under Your data before deleting.</div>
    <label class="f" style="margin-top:12px">Type DELETE to confirm<input class="in" id="del-in" autocomplete="off"></label>
    <div id="del-err" class="small" style="color:var(--warn);margin-top:6px"></div>
    <button class="btn danger block" style="margin-top:12px" id="del-go">Delete my account</button>`, () => {
      $("#del-go").onclick = async () => {
        if ($("#del-in").value.trim() !== "DELETE") return ($("#del-err").textContent = "Type DELETE in capitals to confirm.");
        $("#del-go").disabled = true; $("#del-go").textContent = "Deleting…";
        try { await DZ.deleteAccount(); dzWipeDevice(); location.replace(location.pathname); }
        catch (e) { $("#del-err").textContent = e.message; $("#del-go").disabled = false; $("#del-go").textContent = "Delete my account"; }
      };
    });
}
// Installable app: cache the app shell so it opens fast and works on a weak connection.
if ("serviceWorker" in navigator && location.protocol === "https:") window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));

/* ================= Routing & start ================= */
function route() { let h = location.hash.slice(1); if (h === "weight") h = "progress"; view = VIEWS[h] || SUB[h] || h === "learn" ? h : "home"; if (view === "food") foodDate = foodDate || todayStr(); render(); window.scrollTo(0, 0); }
window.addEventListener("hashchange", route);
document.addEventListener("click", e => { const a = e.target.closest("a[data-learn]"); if (!a) return; e.preventDefault(); openLearn(a.dataset.learn); });
document.addEventListener("input", e => { if (e.target.id !== "learnq") return; const q = e.target.value.trim().toLowerCase(); let n = 0;
  $$("#learnlist .learn").forEach(c => { const hit = !q || c.dataset.text.includes(q); c.style.display = hit ? "" : "none"; if (hit) n++; if (q && hit) c.classList.remove("folded"); });
  $("#learnnone").style.display = n ? "none" : "block"; });
// Keep the fasting timer current without redrawing the whole screen.
setInterval(() => { try { const c = document.getElementById("fastcard"); if (c && view === "home" && fastOn()) c.innerHTML = fastCardInner(); } catch {} }, 30000);
window.addEventListener("error", e => { try { toast("Something went wrong: " + (e.message || "unknown error")); } catch {} });
window.addEventListener("unhandledrejection", e => { try { toast("Something went wrong: " + ((e.reason && e.reason.message) || e.reason || "unknown error")); } catch {} });
evalPhase();
dzBoot();
if (TEST_PROFILES && profCur().pin) setTimeout(() => pinPrompt(profCur(), () => {}), 300);
</script>
